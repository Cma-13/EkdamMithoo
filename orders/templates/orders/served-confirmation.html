{% extends 'orders/base.html' %}

{% block title %}
  Confirm
{% endblock %}

{% block heading %}
  Waiter Dashboard
{% endblock %}

{% block main_content %}
  <div class="flex justify-center">
    <section class="w-full lg:w-1/2 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-5 py-4 bg-slate-900 text-white">
        <h2 class="font-bold text-lg">Confirm Item Served</h2>
      </div>

      <div class="p-4">
        <h1 class="text-xl my-2">Confirm <i>{{ order_item }}</i> has been served to {{ order_item.order.table.name }}?</h1>
        <hr />
        <div class="flex gap-3 items-center mt-3">
          <form method="post">
            {% csrf_token %}
            <button class="py-2 px-3 bg-green-500 rounded-lg text-gray-50 font-semibold hover:bg-green-700" type="submit">Yes, I confirm</button>
          </form>
          <a href="{% url 'menu_view_url' order_item.order.table.id %}" class="py-2 px-3 bg-slate-200 rounded-lg text-slate-800 font-semibold hover:bg-slate-300">Go back</a>
        </div>
      </div>
    </section>
  </div>
{% endblock %}
